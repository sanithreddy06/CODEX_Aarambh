version: '3.8'

services:
  codex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-intelligence
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CODEX
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/codex.db
      - AI_PROVIDER=deterministic
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - codex-data:/app/data
    restart: unless-stopped

volumes:
  codex-data:
